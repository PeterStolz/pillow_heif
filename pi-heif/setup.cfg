[metadata]
name = pi-heif-decoder
description = Python interface for libheif library
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/PeterStolz/pillow_heif/tree/pi-heif
author = Alexander Piskun
author_email = bigcat88@users.noreply.github.com
keywords = heic, heif, pillow
classifiers =
    Development Status :: 5 - Production/Stable
    Intended Audience :: Developers
    Topic :: Software Development
    Topic :: Software Development :: Libraries
    Topic :: Multimedia :: Graphics
    Topic :: Multimedia :: Graphics :: Graphics Conversion
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Programming Language :: Python :: 3.15
    Programming Language :: Python :: Implementation :: CPython
    Programming Language :: Python :: Implementation :: PyPy
    License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)
    Operating System :: MacOS :: MacOS X
    Operating System :: POSIX :: Linux
    Operating System :: Microsoft :: Windows
    Typing :: Typed
license = BSD-3-Clause
license_files =
    LICENSE.txt
    LICENSES_bundled.txt
project_urls =
    Documentation=https://pillow-heif.readthedocs.io
    Source=https://github.com/PeterStolz/pillow_heif/tree/pi-heif
    Changelog=https://github.com/PeterStolz/pillow_heif/blob/pi-heif/CHANGELOG.md

[options]
python_requires = >=3.10
zip_safe = False
packages = find:
install_requires =
    pillow>=11.1.0

[options.extras_require]
tests-min =
    pytest
    defusedxml
    packaging
tests =
    pytest
    defusedxml
    packaging
    numpy
    pympler
