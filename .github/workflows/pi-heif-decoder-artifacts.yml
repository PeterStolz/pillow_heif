name: Pi-Heif decoder wheels

on:
  pull_request:
    branches: [pi-heif]
    paths:
      - ".github/workflows/pi-heif-decoder-artifacts.yml"
      - ".github/transform_to-pi_heif.py"
      - ".github/pi-heif-wheel-test.py"
      - "libheif/**"
      - "pi-heif/**"
      - "pillow_heif/**"
      - "pyproject.toml"
      - "setup.py"
      - "tests/**"
  push:
    branches: [pi-heif]
    tags: ["pi-heif-decoder-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The release line: <upstream pillow-heif version>.postN. Tags must be pi-heif-decoder-v<this>.
  PI_HEIF_VERSION: 1.7.0.post4
  # 69 wheels (the pyproject `[tool.cibuildwheel]` matrix on 8 platforms) + 1 sdist.
  EXPECTED_DISTS: 70

jobs:
  check-version:
    name: Check version
    runs-on: ubuntu-24.04
    steps:
      - name: Verify tag matches PI_HEIF_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "$GITHUB_REF_NAME" != "pi-heif-decoder-v$PI_HEIF_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match PI_HEIF_VERSION=$PI_HEIF_VERSION"
            exit 1
          fi

  build-linux:
    name: ${{ matrix.libc }} • ${{ matrix.arch }}
    needs: check-version
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        libc: [ manylinux, musllinux ]
        arch: [ x86_64, aarch64 ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare decoder-only distribution
        run: |
          cp -a pi-heif/. .
          python3 .github/transform_to-pi_heif.py "$PI_HEIF_VERSION"

      # Pillow has to be built from source for interpreters without a binary wheel (PyPy, free-threaded).
      - name: musllinux preparations
        if: matrix.libc == 'musllinux'
        run: echo INSTALL_OS_PACKAGES="apk update && apk --no-cache add $OS_PACKAGES" >> "$GITHUB_ENV"
        env:
          OS_PACKAGES: "fribidi-dev harfbuzz-dev jpeg-dev lcms2-dev openjpeg-dev zlib-dev"

      - name: manylinux preparations
        if: matrix.libc == 'manylinux'
        run: echo INSTALL_OS_PACKAGES="yum makecache && yum install -y $OS_PACKAGES" >> "$GITHUB_ENV"
        env:
          OS_PACKAGES: "libjpeg-turbo-devel lcms2-devel zlib-devel"

      - name: Reduce build to oldest and newest stable Python
        if: github.event_name == 'pull_request'
        run: echo 'CIBW_BUILD=cp310-* cp315-*' >> "$GITHUB_ENV"

      - name: Build and test wheels
        uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_SKIP: ${{ matrix.libc == 'manylinux' && '*-musllinux*' || '*-manylinux*' }}
          CIBW_BEFORE_ALL_LINUX: |
            set -e
            ${{ env.INSTALL_OS_PACKAGES }}
            python3 -m pip install cmake==3.31.6
            PI_HEIF_DECODER_ONLY=1 python3 {package}/libheif/build_libs.py
          CIBW_ENVIRONMENT_LINUX: >-
            PI_HEIF_DECODER_ONLY=1
            PH_RELEASE_TESTS=1
            PI_HEIF_VERSION=${{ env.PI_HEIF_VERSION }}
          CIBW_TEST_COMMAND: python {project}/.github/pi-heif-wheel-test.py {project}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-linux-${{ matrix.libc }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-macos:
    name: macosx • ${{ matrix.arch }}
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            macosx_target: "11.0"
          - os: macos-15-intel
            arch: x86_64
            macosx_target: "10.15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Prepare decoder-only distribution
        run: |
          cp -a pi-heif/. .
          python3 .github/transform_to-pi_heif.py "$PI_HEIF_VERSION"

      - name: Remove Homebrew codec libraries
        run: brew uninstall --force --ignore-dependencies imagemagick libheif x265 aom libde265 jpeg-turbo

      - name: Reduce build to oldest and newest stable Python
        if: github.event_name == 'pull_request'
        run: echo 'CIBW_BUILD=cp310-* cp315-*' >> "$GITHUB_ENV"

      - name: Build decoder-only libheif
        run: >-
          sudo PI_HEIF_DECODER_ONLY=1
          BUILD_DIR="${{ runner.temp }}/ph-deps"
          MACOSX_DEPLOYMENT_TARGET="${{ matrix.macosx_target }}"
          python3 libheif/build_libs.py

      - name: Install dependencies for Pillow
        run: brew install libjpeg little-cms2

      - name: Build and test wheels
        uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_ENVIRONMENT_MACOS: >-
            PI_HEIF_DECODER_ONLY=1
            PH_RELEASE_TESTS=1
            PI_HEIF_VERSION=${{ env.PI_HEIF_VERSION }}
            ${{ matrix.arch == 'x86_64' && 'TEST_DECODE_THREADS=0' || '' }}
          CIBW_TEST_COMMAND: python {project}/.github/pi-heif-wheel-test.py {project}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_target }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-macos-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-windows:
    name: windows • ${{ matrix.arch_name }}
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: AMD64
            arch_name: x86_64
            msystem: MINGW64
            msys_prefix: mingw64
            msys_packages: "patch mingw-w64-x86_64-binutils"
          - os: windows-11-arm
            arch: ARM64
            arch_name: arm64
            msystem: CLANGARM64
            msys_prefix: clangarm64
            # llvm-tools provides the strip binary required by makepkg
            msys_packages: "patch mingw-w64-clang-aarch64-llvm-tools"
    env:
      MSYS2_PREFIX: "C:/temp/msys64/${{ matrix.msys_prefix }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          location: C:/temp
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.msys_packages }}

      - name: Prepare decoder-only distribution
        shell: bash
        run: |
          cp -a pi-heif/. .
          python .github/transform_to-pi_heif.py "$PI_HEIF_VERSION"

      - name: Build decoder-only libheif
        shell: msys2 {0}
        run: |
          cd libheif/windows/mingw-w64-libheif
          makepkg-mingw --syncdeps --noconfirm -f
          pacman -U mingw-w64-*-libheif-*-any.pkg.tar.zst --noconfirm

      - name: Reduce build to oldest and newest stable Python
        if: github.event_name == 'pull_request'
        shell: bash
        run: echo 'CIBW_BUILD=cp310-* cp315-*' >> "$GITHUB_ENV"

      - name: Build and test wheels
        uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_ENVIRONMENT_WINDOWS: >-
            PI_HEIF_DECODER_ONLY=1
            PH_RELEASE_TESTS=1
            PI_HEIF_VERSION=${{ env.PI_HEIF_VERSION }}
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
            delvewheel repair -vv -w {dest_dir} {wheel}
            --add-path ${{ env.MSYS2_PREFIX }}/bin
          CIBW_TEST_COMMAND: python {project}/.github/pi-heif-wheel-test.py {project}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-windows-${{ matrix.arch_name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    needs: check-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Prepare decoder-only distribution
        run: |
          cp -a pi-heif/. .
          python3 .github/transform_to-pi_heif.py "$PI_HEIF_VERSION"

      - name: Build decoder-only libheif
        run: sudo PI_HEIF_DECODER_ONLY=1 BUILD_DIR="${{ runner.temp }}/ph-deps" python3 libheif/build_libs.py

      - name: Build sdist
        run: |
          python3 -m pip install build
          python3 -m build --sdist --outdir wheelhouse

      - name: Install and test sdist
        env:
          PI_HEIF_DECODER_ONLY: 1
          PH_RELEASE_TESTS: 1
        run: |
          python3 -m pip install pytest pillow numpy pympler defusedxml packaging
          python3 -m pip install wheelhouse/*.tar.gz
          python3 .github/pi-heif-wheel-test.py "$PWD"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-sdist
          path: wheelhouse/*.tar.gz
          if-no-files-found: error

  check-dists:
    name: Check dists
    needs: [ build-linux, build-macos, build-windows, sdist ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Check dists with twine
        run: |
          python3 -m pip install "twine>=6.1.0" "packaging>=24.2"
          python3 -m twine check --strict dist/*

      - name: Check dists count
        if: github.event_name != 'pull_request'
        run: |
          find dist -type f
          DISTS=$(find dist -type f | wc -l)
          if [ "$DISTS" -ne "$EXPECTED_DISTS" ]; then
            echo "Expected $EXPECTED_DISTS dists, found $DISTS"
            exit 1
          fi

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/pi-heif-decoder-v')
    needs: [ check-version, check-dists ]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/pi-heif-decoder
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/pi-heif-decoder-v')
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
