name: Pi-Heif decoder artifacts

on:
  pull_request:
    branches: [pi-heif]
    paths:
      - ".github/workflows/pi-heif-decoder-artifacts.yml"
      - ".github/transform_to-pi_heif.py"
      - "packaging/**"
      - "pi-heif/**"
      - "pillow_heif/**"
      - "setup.py"
  push:
    branches: [pi-heif]
    tags: ["pi-heif-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build decoder artifact
        run: |
          docker build \
            --file packaging/Dockerfile.decoder-artifact \
            --output type=local,dest=dist \
            .
          tar -C dist -czf "pi-heif-decoder-1.7.0.post1-libheif-1.23.4-${{ matrix.arch }}.tar.gz" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pi-heif-decoder-${{ matrix.arch }}
          path: pi-heif-decoder-*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/pi-heif-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v8.0.0
        with:
          pattern: pi-heif-decoder-*
          merge-multiple: true
          path: dist
      - name: Publish GitHub release
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
